<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiskWala Player</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0b0e14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #141a24;
            border-radius: 20px;
            padding: 30px;
        }
        h1 { text-align:center; margin-bottom:20px; }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-area input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1a1f2e;
            color: #fff;
            font-size: 16px;
        }
        .input-area button {
            padding: 14px 30px;
            border-radius: 10px;
            border: none;
            background: #5b7cfa;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-area button:hover { background: #4a6ae0; }
        #playerArea {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            display: none;
        }
        #status {
            position: absolute;
            color: #888;
            font-size: 18px;
            text-align: center;
        }
        .info {
            margin-top: 15px;
            padding: 15px;
            background: #1a1f2e;
            border-radius: 10px;
            font-size: 14px;
            color: #888;
        }
        .info strong { color: #fff; }
        @media (max-width: 600px) {
            .input-area { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 DiskWala Player</h1>
        
        <div class="input-area">
            <input type="text" id="urlInput" placeholder="DiskWala लिंक पेस्ट करें">
            <button id="playBtn">▶ चलाएँ</button>
        </div>

        <div id="playerArea">
            <video id="videoPlayer" controls controlslist="nodownload"></video>
            <div id="status">वीडियो लोड हो रहा है...</div>
        </div>

        <div class="info" id="info">
            <strong>स्थिति:</strong> <span id="statusText">URL डालें और चलाएँ</span>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const playBtn = document.getElementById('playBtn');
        const video = document.getElementById('videoPlayer');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');

        // Disable download
        video.addEventListener('contextmenu', e => e.preventDefault());

        async function playVideo() {
            const url = urlInput.value.trim();
            if (!url) return;

            playBtn.disabled = true;
            playBtn.textContent = '⏳...';
            status.style.display = 'block';
            status.textContent = '🔍 वीडियो ढूंढा जा रहा है...';
            statusText.textContent = '⏳ प्रोसेसिंग...';
            video.style.display = 'none';

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.success && data.videoUrl) {
                    statusText.textContent = '✅ वीडियो मिल गया!';
                    status.textContent = '⏳ लोड हो रहा है...';
                    
                    video.src = data.videoUrl;
                    video.style.display = 'block';
                    
                    try {
                        await video.play();
                        status.style.display = 'none';
                    } catch (e) {
                        status.textContent = '⚠️ प्ले नहीं हो पाया, मैन्युअल Play दबाएँ';
                    }
                } else {
                    statusText.textContent = '❌ ' + (data.error || 'वीडियो नहीं मिला');
                    status.textContent = '😕 वीडियो URL नहीं मिल सका';
                }
            } catch (error) {
                statusText.textContent = '❌ सर्वर त्रुटि';
                status.textContent = '⚠️ ' + error.message;
            }

            playBtn.disabled = false;
            playBtn.textContent = '▶ चलाएँ';
        }

        playBtn.addEventListener('click', playVideo);
        urlInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') playVideo();
        });
    </script>
</body>
</html>
