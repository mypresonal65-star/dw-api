<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiskWala Video Extractor</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e14;
      color: #f0f4fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 960px;
      background: #141a24;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #5b7cfa, #8b6dfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .sub { text-align:center; color:#7a8aa8; font-size:0.95rem; margin-bottom:25px; }
    
    .input-area {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .input-area input {
      flex: 1;
      min-width: 200px;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid #2c3545;
      background: #1d2636;
      color: #f0f4fa;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s;
    }
    .input-area input:focus { border-color: #5b7cfa; }
    .input-area input::placeholder { color: #5a6a88; }
    
    .input-area button {
      padding: 14px 32px;
      border-radius: 12px;
      border: none;
      background: #5b7cfa;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .input-area button:hover { background: #4a6ae0; }
    .input-area button:active { transform: scale(0.96); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

    .options-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #1d2636;
      border-radius: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .options-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9aabca;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .options-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #5b7cfa;
      cursor: pointer;
    }

    #playerArea {
      background: #0a0d12;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 300px;
    }
    #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0a0d12;
      display: none;
    }
    #status {
      position: absolute;
      color: #9aabca;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }
    #status .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #2c3545;
      border-top-color: #5b7cfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .info-box {
      margin-top: 16px;
      padding: 16px 20px;
      background: #1d2636;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #7a8aa8;
    }
    .info-box strong { color: #f0b3b3; }
    .info-box code {
      background: #0b0e14;
      padding: 2px 8px;
      border-radius: 4px;
      color: #5b7cfa;
      font-size: 0.8rem;
    }
    .info-box .method {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .method-cheerio { background: #1a3a2a; color: #4ade80; }
    .method-puppeteer { background: #3a1a2a; color: #f472b6; }
    .method-fallback { background: #3a2a1a; color: #fbbf24; }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-success { background: #1a3a2a; color: #4ade80; }
    .badge-error { background: #3a1a1a; color: #f87171; }
    .badge-warning { background: #3a2a1a; color: #fbbf24; }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 0.8rem;
      color: #5a6a88;
    }
    .footer a { color: #5b7cfa; text-decoration: none; }

    @media (max-width: 600px) {
      .container { padding: 16px; }
      .input-area { flex-direction: column; }
      .input-area button { width: 100%; justify-content: center; }
      .options-row { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 DiskWala Video Extractor</h1>
  <p class="sub">वीडियो URL निकालें और चलाएं • डाउनलोड अक्षम</p>

  <div class="input-area">
    <input type="text" id="videoUrlInput" placeholder="DiskWala लिंक पेस्ट करें (https://www.diskwala.com/app/...)" />
    <button id="loadBtn">▶ चलाएँ</button>
  </div>

  <div class="options-row">
    <label>
      <input type="checkbox" id="usePuppeteer" />
      🕷️ Puppeteer मोड (धीमा, पर ज़्यादा सटीक)
    </label>
    <span style="color:#5a6a88; font-size:0.8rem; margin-left:auto;">
      ⚡ Cheerio (तेज़) → Puppeteer (fallback)
    </span>
  </div>

  <div id="playerArea">
    <video id="videoPlayer" controls controlslist="nodownload" disablePictureInPicture></video>
    <div id="status">
      <div class="spinner"></div>
      <div>वीडियो लोड हो रहा है...</div>
    </div>
  </div>

  <div class="info-box" id="infoBox">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; align-items:center;">
      <span>📌 <strong>स्थिति:</strong> <span id="statusText">URL डालें और चलाएँ</span></span>
      <span id="methodBadge"></span>
    </div>
    <div style="margin-top:8px; font-size:0.8rem; color:#5a6a88;">
      ⏱️ <span id="timeTaken">-</span> सेकंड
    </div>
  </div>

  <div class="footer">
    🔒 डाउनलोड सुरक्षित • API: <code>POST /api/extract</code> • <a href="#" onclick="fetch('/api/health').then(r=>r.json()).then(d=>alert(JSON.stringify(d,null,2)))">health</a>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('videoUrlInput');
  const loadBtn = document.getElementById('loadBtn');
  const video = document.getElementById('videoPlayer');
  const status = document.getElementById('status');
  const usePuppeteer = document.getElementById('usePuppeteer');
  const statusText = document.getElementById('statusText');
  const methodBadge = document.getElementById('methodBadge');
  const timeTaken = document.getElementById('timeTaken');

  // 🛡️ Disable download on video
  video.addEventListener('contextmenu', (e) => e.preventDefault());
  video.addEventListener('keydown', (e) => {
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      return false;
    }
  });

  async function loadVideo(url) {
    if (!url) {
      statusText.textContent = '⚠️ कृपया URL डालें';
      return;
    }

    // Show loading state
    loadBtn.disabled = true;
    loadBtn.textContent = '⏳ लोड हो रहा...';
    status.style.display = 'flex';
    status.innerHTML = `<div class="spinner"></div><div>🔍 वीडियो URL ढूंढा जा रहा है...</div>`;
    video.style.display = 'none';
    statusText.textContent = '⏳ प्रोसेसिंग...';
    methodBadge.innerHTML = '';
    timeTaken.textContent = '-';

    try {
      const response = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: url,
          usePuppeteer: usePuppeteer.checked
        })
      });

      const data = await response.json();

      if (data.success && data.videoUrl) {
        // Update status
        statusText.textContent = '✅ वीडियो मिल गया!';
        statusText.style.color = '#4ade80';
        
        // Show method
        const methodClass = data.method === 'puppeteer' ? 'method-puppeteer' : 
                           data.method === 'full-page-scan' ? 'method-fallback' : 'method-cheerio';
        methodBadge.innerHTML = `<span class="method ${methodClass}">${data.method || 'unknown'}</span>`;
        timeTaken.textContent = data.timeTaken || '-';

        // Load video
        status.innerHTML = '⏳ वीडियो लोड हो रहा है...';
        video.src = data.videoUrl;
        video.style.display = 'block';
        
        // Try to play
        try {
          await video.play();
          status.style.display = 'none';
        } catch (playError) {
          status.innerHTML = '⚠️ वीडियो चलाने में समस्या, क्लिक करें Play';
          status.style.display = 'flex';
        }

        // Hide status after 3 seconds if playing
        setTimeout(() => {
          if (!video.paused) {
            status.style.display = 'none';
          }
        }, 3000);

      } else {
        // Error
        statusText.textContent = '❌ ' + (data.error || data.message || 'वीडियो URL नहीं मिला');
        statusText.style.color = '#f87171';
        status.innerHTML = `
          <div style="font-size:2rem; margin-bottom:10px;">😕</div>
          <div>${data.error || data.message || 'वीडियो नहीं मिल सका'}</div>
          <div style="font-size:0.8rem; margin-top:8px; color:#5a6a88;">${data.debug || ''}</div>
        `;
        video.style.display = 'none';
        methodBadge.innerHTML = `<span class="badge badge-error">❌ failed</span>`;
      }

    } catch (error) {
      statusText.textContent = '❌ सर्वर त्रुटि';
      statusText.style.color = '#f87171';
      status.innerHTML = `
        <div style="font-size:2rem; margin-bottom:10px;">⚠️</div>
        <div>सर्वर से कनेक्ट नहीं हो पाया</div>
        <div style="font-size:0.8rem; margin-top:8px; color:#5a6a88;">${error.message}</div>
      `;
      video.style.display = 'none';
      methodBadge.innerHTML = `<span class="badge badge-error">❌ error</span>`;
    }

    // Reset button
    loadBtn.disabled = false;
    loadBtn.textContent = '▶ चलाएँ';
  }

  loadBtn.addEventListener('click', () => loadVideo(input.value.trim()));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadVideo(input.value.trim());
  });

  // Auto-load from URL parameter
  const params = new URLSearchParams(window.location.search);
  const urlParam = params.get('url');
  if (urlParam) {
    input.value = urlParam;
    loadVideo(urlParam);
  }
});
</script>
</body>
</html>
